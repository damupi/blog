---
layout: default
---
<article class="post">
  <div class="wrap">
    <a class="back" href="{{ '/' | relative_url }}">&larr; back to writing</a>
    <h1>{{ page.title }}</h1>
    <div class="meta">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      {% if page.tags.size > 0 %}
      <span class="tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </span>
      {% endif %}
    </div>
    <div class="content">
      {{ content }}
    </div>
    <a class="back" href="{{ '/' | relative_url }}">&larr; back to log</a>
  </div>
</article>
